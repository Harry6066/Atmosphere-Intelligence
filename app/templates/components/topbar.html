<!-- Top Navigation Bar Component -->
<header class="atm-topbar sticky top-0 z-20 h-16 flex items-center justify-between px-4 sm:px-6">
  
  <!-- Left Side: Mobile Menu Button & Breadcrumbs -->
  <div class="flex items-center gap-3">
    <!-- Mobile Menu Trigger -->
    <button id="mobile-menu-btn" class="lg:hidden p-2 rounded-md text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-card)] transition-colors" aria-label="Open Navigation">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Breadcrumb Trail -->
    {% include "components/breadcrumbs.html" %}
  </div>

  <!-- Right Side: Global Search, Status Pill & Theme Switcher -->
  <div class="flex items-center gap-3 sm:gap-4">
    
    <!-- Visual Global Search Interface -->
    <div class="relative hidden md:block">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[var(--text-muted)]">
        <i data-lucide="search" class="w-4 h-4"></i>
      </div>
      <input
        type="text"
        id="global-search-input"
        placeholder="Filter records, stations, events..."
        aria-label="Global Observation Search"
        class="w-64 lg:w-72 pl-9 pr-14 py-1.5 bg-[var(--bg-input)] border border-[var(--border-subtle)] rounded-lg text-xs text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:border-[var(--accent-cyan)] focus:ring-1 focus:ring-[var(--accent-cyan)] transition-all font-sans"
      />
      <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
        <kbd class="px-1.5 py-0.5 text-[10px] font-mono font-medium text-[var(--text-muted)] bg-[var(--bg-card)] border border-[var(--border-subtle)] rounded shadow-sm">Ctrl K</kbd>
      </div>
    </div>

    <!-- Live System Status Badge -->
    <div class="hidden sm:inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-[var(--status-normal-bg)] border border-emerald-500/20 text-xs font-mono font-medium text-emerald-400">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="hidden lg:inline">SIH26073 //</span> 11,688 Records
    </div>

    <!-- Theme Switcher Toggle -->
    <button
      id="theme-toggle-btn"
      class="p-2 rounded-lg text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-card-hover)] border border-[var(--border-subtle)] transition-colors"
      title="Switch Theme (Dark / Light)"
      aria-label="Toggle Theme"
    >
      <span id="theme-toggle-icon">
        <i data-lucide="sun" class="w-5 h-5 text-amber-400"></i>
      </span>
    </button>

    <!-- Health Check Status Link -->
    <a
      href="/api/health"
      target="_blank"
      class="p-2 rounded-lg text-[var(--text-secondary)] hover:text-[var(--accent-cyan)] hover:bg-[var(--bg-card-hover)] border border-[var(--border-subtle)] transition-colors hidden sm:inline-flex"
      title="Inspect Live JSON Health Endpoint"
      aria-label="Inspect Live JSON Health Endpoint"
    >
      <i data-lucide="activity" class="w-5 h-5"></i>
    </a>

  </div>

</header>
